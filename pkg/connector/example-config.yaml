# VoIP.ms API settings. Credentials are NOT configured here — run
# `!matrisms login` from Matrix and they are stored encrypted in the bridge DB.
voipms:
    # Base URL of the VoIP.ms REST API. Only change for testing.
    base_url: https://voip.ms/api/v1/rest.php
    # How often (seconds) each account polls for new SMS/MMS. VoIP.ms has no
    # push API besides the SMS URL callback (see webhook below), so polling is
    # the baseline. Default 30. Don't go too low — VoIP.ms throttles.
    poll_interval_seconds: 30
    # How far back (hours) the first poll after login looks for messages.
    # 0 means the default (24). Set -1 to only bridge new messages.
    startup_backfill_hours: 24
    # Max size in bytes for a single inbound MMS media upload to Matrix.
    # 0 means the default (26214400 = 25 MiB). Set -1 to disable the check.
    max_upload_bytes: 0
    # Use the VoIP.ms phonebook to name contacts (ghost users and rooms show
    # "Jane Doe" instead of a bare number). Rename contacts from Matrix with
    # `!matrisms rename <name>` inside a conversation room.
    phonebook_names: true
    # How long (minutes) phonebook names are cached before re-fetching.
    phonebook_refresh_minutes: 15
    # Convert reaction-fallback texts ('Reacted [emoji] to "..."', Apple
    # tapbacks, French variants) into real Matrix reactions on the quoted
    # message. Unrecognized texts always fall back to plain messages.
    convert_reactions: true
    # How reactions you send from Matrix are rendered as SMS.
    # Placeholders: {emoji}, {message}
    reaction_fallback_template: 'Reacted {emoji} to "{message}"'
    reaction_remove_fallback_template: 'Removed {emoji} from "{message}"'
    # VoIP.ms reassembles long inbound multipart SMS in segment-arrival order,
    # which sometimes scrambles the text. When true, the bridge detects
    # structurally-scrambled bodies and restores the original segment order
    # (conservative: only rewrites on unambiguous evidence).
    unscramble_segments: true
    # Automatic reconnection. If the startup credential check fails, or the poll
    # loop dies, the bridge waits this many seconds and tries again, doubling
    # the wait after each consecutive failure up to
    # connect_retry_max_interval_seconds. Without this a transient VoIP.ms /
    # Cloudflare hiccup (e.g. HTTP 522) at startup silently stops inbound SMS
    # until the bridge is restarted by hand. Set -1 to disable retries.
    connect_retry_interval_seconds: 30
    connect_retry_max_interval_seconds: 600
    # How many consecutive retries before giving up until the next restart.
    # 0 = retry forever. A successful connection resets the counter.
    connect_max_retries: 0

# Optional instant-delivery webhook. When enabled, point the VoIP.ms
# "SMS URL Callback" (Main Menu → DID Settings) at this listener and messages
# arrive the moment VoIP.ms receives them; polling stays on as a safety net.
# Callback URL format:
#   https://your.host:29332/sms?token=<secret>&to={TO}&from={FROM}&message={MESSAGE}&id={ID}&date={TIMESTAMP}
webhook:
    enabled: false
    listen_address: 0.0.0.0:29332
    path: /sms
    # Optional shared secret; when set, requests without ?token=<secret> are
    # rejected. Strongly recommended for internet-reachable listeners.
    secret: ""

logging:
    # When true, redact PII (phone numbers, message bodies) from debug logs.
    sanitized: false
